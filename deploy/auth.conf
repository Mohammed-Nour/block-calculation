auth_basic "BlockCalc";
auth_basic_user_file /etc/nginx/blockcalc.htpasswd;
set $blockcalc_forwarded_proto https;

# The loopback-published port is reached through the host's Docker bridge.
# Funnel overwrites X-Forwarded-For; use its final client address, never a
# caller-supplied earlier address. Custom bridge ranges need an explicit update.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# Include assets and invalid logins so neither can bypass the shared budget.
# A burst accommodates the SPA's initial parallel asset requests.
limit_req zone=blockcalc_public burst=180 nodelay;
limit_req_status 429;
limit_req_log_level warn;
