# Handle both prefix-preserving and prefix-stripping reverse proxies.
map $request_uri $blockcalc_upstream_uri {
    ~^/blockcalc(?<blockcalc_path>/.*)$ $blockcalc_path;
    default $request_uri;
}

# Only the public profile enables this zone. Health probes never consume it.
map $uri $blockcalc_limit_key {
    /health "";
    default $binary_remote_addr;
}
limit_req_zone $blockcalc_limit_key zone=blockcalc_public:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    include /etc/nginx/blockcalc-auth.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker DNS refreshes the address after the backend container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://backend:8000;

    location = /blockcalc {
        return 308 /blockcalc/;
    }

    location /blockcalc/ {
        rewrite ^/blockcalc/(.*)$ /$1 last;
    }

    # Container and operator health checks reveal no business records.
    location = /health {
        auth_basic off;
        proxy_pass $api_upstream$blockcalc_upstream_uri;
        add_header Cache-Control no-store always;
    }

    location ~ ^/(api(?:/|$)|health$|docs(?:/|$)|redoc$|openapi\.json$) {
        proxy_pass $api_upstream$blockcalc_upstream_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $blockcalc_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
